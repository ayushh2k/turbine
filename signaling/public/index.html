<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Turbine P2P WebRTC Signaling Service</title>
  <style>
    body {
      background-color: #050c16;
      color: #00e5c8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #091728;
      border: 1px solid #173757;
      border-radius: 12px;
      padding: 32px 48px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; font-size: 24px; }
    p { color: #8ba5bd; font-size: 14px; }
    .badge {
      display: inline-block;
      background: rgba(0, 229, 200, 0.15);
      border: 1px solid #00e5c8;
      color: #00e5c8;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚡ Turbine P2P Signaling Service</h1>
    <p>Zero-server ephemeral WebRTC pairing endpoint</p>
    <div class="badge">● Online & Ready</div>
  </div>
</body>
</html>
