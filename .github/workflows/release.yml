name: Release

# Triggers on any tag push matching v* (e.g. v0.1.0, v1.2.3-beta.1)
on:
  push:
    tags:
      - 'v*'

# Required to create GitHub Releases and upload assets
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS — universal binary (Apple Silicon + Intel in one .dmg)
          - name: macOS (universal)
            platform: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-args: --target universal-apple-darwin

          # Linux — .deb + .AppImage
          - name: Linux (x64)
            platform: ubuntu-22.04
            rust-targets: ''
            tauri-args: ''

          # Windows — .exe installer + .msi
          - name: Windows (x64)
            platform: windows-latest
            rust-targets: ''
            tauri-args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node + pnpm ──────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store path
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Rust ─────────────────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Linux system dependencies ─────────────────────────────────────────────
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── Build + create GitHub Release ────────────────────────────────────────
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # ── macOS code signing (optional) ──────────────────────────────────
          # To enable signed + notarized macOS builds, add these as repo Secrets:
          # Settings → Secrets → Actions → New repository secret
          #
          # APPLE_CERTIFICATE          — base64-encoded Developer ID Application .p12
          # APPLE_CERTIFICATE_PASSWORD — password for the .p12
          # APPLE_SIGNING_IDENTITY     — e.g. "Developer ID Application: Your Name (TEAM_ID)"
          # APPLE_ID                   — your Apple ID email
          # APPLE_PASSWORD             — app-specific password (appleid.apple.com)
          # APPLE_TEAM_ID              — your Apple Developer team ID
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Turbine ${{ github.ref_name }}'
          # Reads from CHANGELOG.md if present; falls back to this message
          releaseBody: |
            ## What's new in ${{ github.ref_name }}

            See [CHANGELOG.md](https://github.com/ayushh2k/turbine/blob/main/CHANGELOG.md) for full release notes.

            ### Downloads

            | Platform | File |
            |----------|------|
            | macOS (Universal) | `Turbine_*.dmg` |
            | Linux | `turbine-app_*_amd64.deb` · `turbine-app_*_amd64.AppImage` |
            | Windows | `Turbine_*_x64-setup.exe` · `Turbine_*_x64_en-US.msi` |
          releaseDraft: true       # Creates a draft — review before publishing
          prerelease: ${{ contains(github.ref_name, '-') }}  # auto-prerelease for v1.0.0-beta.1 etc.
          args: ${{ matrix.tauri-args }}
